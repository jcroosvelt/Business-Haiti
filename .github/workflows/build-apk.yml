name: Build APK (Statuts)

on:
  push:
    paths:
      - "statuts_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère l'ossature Android officielle dans un dossier temporaire,
      # puis la copie dans le projet (lib/ et pubspec.yaml restent intacts).
      - name: Générer l'ossature Android
        run: |
          flutter create --platforms=android --org ht.businesshaiti --project-name statuts_app "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" statuts_app/android
          sed -i 's/android:label="[^"]*"/android:label="Statuts"/' statuts_app/android/app/src/main/AndroidManifest.xml
          # Permissions pour lire la galerie (Android 13+ et anciennes versions)
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' statuts_app/android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" statuts_app/android/app/src/main/AndroidManifest.xml

      # Certains plugins sont compilés avec un compileSdk trop ancien : on force 36 partout.
      - name: Forcer compileSdk 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              def android = p.extensions.findByName("android")
              if (android != null) { android.compileSdkVersion(36) }
            }
          }
          // Le lint de release plante sur certains plugins (bug de l'outil) : inutile pour produire l'APK.
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze") || t.name.startsWith("lintReport")) { t.enabled = false }
            }
          }
          GRADLE

      - name: Dépendances
        working-directory: statuts_app
        run: flutter pub get

      - name: Analyse
        working-directory: statuts_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # APK universel : processeurs 32 bits (armeabi-v7a) ET 64 bits (arm64-v8a)
      - name: Compiler l'APK universel
        working-directory: statuts_app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/debug-info

      - name: Renommer et inspecter
        run: |
          cp statuts_app/build/app/outputs/flutter-apk/app-release.apk statuts.apk
          ls -lh statuts.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump badging statuts.apk | grep -E "^package|sdkVersion|targetSdkVersion|native-code" || true

      - uses: actions/upload-artifact@v4
        with:
          name: statuts-apk
          path: statuts.apk
          retention-days: 90

      - name: Publier une Release (téléchargement direct depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Statuts APK #${{ github.run_number }}
          files: statuts.apk
          prerelease: true
