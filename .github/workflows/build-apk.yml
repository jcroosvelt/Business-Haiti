name: Build APK (Statuts)

on:
  push:
    paths:
      - "statuts_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère l'ossature Android officielle dans un dossier temporaire,
      # puis la copie dans le projet (lib/ et pubspec.yaml restent intacts).
      - name: Générer l'ossature Android
        run: |
          flutter create --platforms=android --org ht.businesshaiti --project-name statuts_app "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" statuts_app/android
          sed -i 's/android:label="[^"]*"/android:label="Statuts"/' statuts_app/android/app/src/main/AndroidManifest.xml

      - name: Dépendances
        working-directory: statuts_app
        run: flutter pub get

      - name: Analyse
        working-directory: statuts_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compiler l'APK
        working-directory: statuts_app
        run: flutter build apk --release

      - name: Renommer
        run: cp statuts_app/build/app/outputs/flutter-apk/app-release.apk statuts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: statuts-apk
          path: statuts.apk
          retention-days: 90

      - name: Publier une Release (téléchargement direct depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Statuts APK #${{ github.run_number }}
          files: statuts.apk
          prerelease: true
